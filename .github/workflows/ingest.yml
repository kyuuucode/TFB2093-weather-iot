name: hourly-weather-ingest

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-ingest
  cancel-in-progress: false

env:
  TZ: Asia/Kuala_Lumpur

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests schedule pandas numpy

      - run: python backend/weather_ingest.py --once

      - name: Rebuild SQLite from CSV
        run: |
          rm -f database/weather.db
          python database/load_csv_to_db.py data

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git add -f database/weather.db
          git diff --cached --quiet || git commit -m "Hourly update $(date +%FT%T)"
          git pull --rebase
          git push
